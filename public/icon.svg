<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Red gradient for dots -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#eb2f2f"/>
      <stop offset="100%" stop-color="#c41818"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background (Optional clear white / transparent) -->
  <rect width="512" height="512" rx="64" fill="#ffffff" />

  <!-- Left: Red Connected Organic Halftone Nodes -->
  <g filter="url(#shadow)">
    <!-- Connecting arms -->
    <!-- Top arm to center -->
    <path d="M 160 145 C 160 145, 145 195, 130 230 C 122 248, 120 252, 125 258 C 130 264, 138 260, 155 245 C 175 228, 180 180, 180 160 Z" fill="url(#dotGrad)"/>
    <!-- Center to bottom bulb -->
    <path d="M 100 240 C 90 270, 115 340, 135 370 C 145 385, 165 375, 155 350 C 140 315, 135 270, 140 240 Z" fill="url(#dotGrad)"/>
    <!-- Left node to center -->
    <path d="M 50 245 C 70 240, 100 245, 125 245 C 125 255, 95 260, 50 255 Z" fill="url(#dotGrad)"/>

    <!-- Actual organic curves matching Halftone Maker logo -->
    <!-- Center node -->
    <circle cx="125" cy="245" r="32" fill="url(#dotGrad)"/>
    <!-- Top-Right node -->
    <circle cx="170" cy="145" r="22" fill="url(#dotGrad)"/>
    <!-- Left small node -->
    <circle cx="48" cy="248" r="24" fill="url(#dotGrad)"/>
    <!-- Bottom large node -->
    <circle cx="145" cy="385" r="38" fill="url(#dotGrad)"/>

    <!-- Subtle white glossy highlights on nodes -->
    <ellipse cx="165" cy="138" rx="6" ry="4" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="118" cy="235" rx="8" ry="5" fill="#ffffff" opacity="0.5"/>
    <ellipse cx="42" cy="242" rx="7" ry="4" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="136" cy="372" rx="12" ry="7" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Right: Halftone Maker Typography -->
  <!-- "Halftone" custom stylized letters -->
  <g fill="#111827">
    <!-- H -->
    <path d="M 215 155 L 225 155 L 225 210 L 235 210 L 235 280 L 225 280 L 225 220 L 215 220 Z"/>
    <path d="M 235 180 L 245 180 L 245 280 L 235 280 Z"/>
    <!-- a -->
    <path d="M 255 200 C 255 175, 275 160, 280 280 L 270 280 C 268 250, 268 220, 265 210 C 260 230, 258 260, 255 280 L 248 280 Z"/>
    <!-- l -->
    <path d="M 288 150 L 298 150 L 298 280 L 288 280 Z"/>
    <!-- f -->
    <path d="M 308 145 C 318 140, 328 150, 326 165 L 316 165 C 316 155, 314 155, 310 158 L 310 280 L 302 280 L 302 185 L 296 185 L 296 175 L 304 175 Z"/>
    <!-- t -->
    <path d="M 334 165 L 344 165 L 344 180 L 352 180 L 352 190 L 344 190 L 344 268 C 344 275, 348 278, 354 276 L 354 284 C 342 288, 334 282, 334 268 Z"/>
    <!-- o -->
    <path d="M 360 225 C 360 185, 382 185, 382 225 C 382 265, 360 265, 360 225 Z M 370 225 C 370 250, 372 250, 372 225 C 372 200, 370 200, 370 225 Z"/>
    <!-- n -->
    <path d="M 392 195 L 400 195 L 400 215 C 405 200, 418 198, 424 210 L 424 280 L 414 280 L 414 220 C 412 210, 404 212, 402 225 L 402 280 L 392 280 Z"/>
    <!-- e -->
    <path d="M 432 235 C 432 195, 456 195, 456 228 L 442 228 C 442 210, 448 205, 448 215 C 448 218, 434 220, 434 235 C 434 260, 456 260, 456 245 L 464 248 C 460 272, 432 270, 432 235 Z"/>
  </g>

  <!-- Text "Maker" inside rounded black badge -->
  <g>
    <rect x="215" y="300" width="250" height="76" rx="14" fill="#000000"/>
    <text x="340" y="354" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">Maker</text>
  </g>
</svg>
